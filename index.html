<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F07300">
<meta name="color-scheme" content="light">
<title>PDJ & Hygiène AABD</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#FAF7F2; --card:#FFFFFF; --ink:#1F1B16; --muted:#6B6258; --line:#E3DACD;
  --accent:#F07300; --accent-soft:#FDEBD9; --accent-ink:#8A4200;
  --ok:#1E7B34; --ok-soft:#E3F2E6; --bad:#B42318; --bad-soft:#FBE7E5;
  --info:#4B5A8C; --info-soft:#E7EAF4; --radius:14px; --tap:56px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding-bottom:calc(78px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:3px solid var(--accent);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand b{font-size:19px}.brand small{display:block;color:var(--muted);font-size:12px}
.net{font-size:13px;padding:4px 10px;border-radius:99px;background:var(--bad-soft);color:var(--bad);font-weight:600}
main{max-width:720px;margin:0 auto;padding:16px}
h2{font-size:22px;margin:4px 0 6px;line-height:1.2}
h3{font-size:18px;margin:0 0 10px}
.hint{color:var(--muted);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
.banner{border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;font-size:15px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner.warn{background:var(--accent-soft);color:var(--accent-ink);border:1px solid #F5C99B}
.banner.bad{background:var(--bad-soft);color:var(--bad);border:1px solid #F1B8B2}
.banner.info{background:var(--info-soft);color:var(--info);border:1px solid #C9D0E6}
.banner.ok{background:var(--ok-soft);color:var(--ok);border:1px solid #B9DEC1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:10px 18px;border-radius:12px;border:2px solid var(--ink);background:var(--card);font-weight:700;cursor:pointer;text-decoration:none;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.ghost{border-color:var(--line)}
.btn.small{min-height:48px;padding:6px 14px;font-size:15px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.block{display:flex;width:100%}
.hero{display:flex;width:100%;min-height:96px;font-size:22px;border-radius:18px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 140px}
label.f{display:block;font-weight:700;margin:14px 0 6px}
label.f .opt{font-weight:400;color:var(--muted)}
.inp{width:100%;min-height:var(--tap);padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:#fff}
.inp:focus{outline:none;border-color:var(--accent)}
textarea.inp{min-height:90px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:50px;padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:600;cursor:pointer;text-align:left}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:58px;height:58px;border-radius:12px;border:2px solid var(--ink);background:#fff;font-size:28px;font-weight:700;cursor:pointer;flex:0 0 auto}
.stepper input{width:96px;text-align:center;font-size:28px;font-weight:800;min-height:58px;border:2px solid var(--line);border-radius:12px;background:#fff}
.small-stepper button{width:46px;height:46px;font-size:22px}
.small-stepper input{width:64px;font-size:20px;min-height:46px}
.muted{color:var(--muted)} .small{font-size:14px}
code{background:#F1ECE4;padding:1px 5px;border-radius:5px;font-size:14px;word-break:break-all}
/* Service */
.svc-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.svc-head .t{font-size:20px;font-weight:800}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.now{background:var(--accent);color:#fff;border:0}
.now .l{font-size:14px;opacity:.9;font-weight:600}
.now .t{font-size:21px;font-weight:800;margin:2px 0 10px}
.now .btn{background:#fff;color:var(--accent-ink);border-color:#fff}
.phases{display:grid;gap:8px}
.ph{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:64px}
.ph .ic{font-size:24px;text-align:center}
.ph .t{font-weight:700;line-height:1.2}
.ph .s{color:var(--muted);font-size:14px}
.pill{display:inline-block;padding:4px 10px;border-radius:99px;font-size:13px;font-weight:700;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-todo{background:#EEEAE4;color:var(--muted)}
.p-run{background:var(--accent-soft);color:var(--accent-ink)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-late{background:var(--bad-soft);color:var(--bad)}
.checks{display:grid;gap:8px}
.ck{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:center;width:100%;min-height:62px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer}
.ck .box{width:36px;height:36px;border-radius:9px;border:3px solid var(--muted);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;color:#fff}
.ck.on{border-color:var(--ok);background:var(--ok-soft)}
.ck.on .box{background:var(--ok);border-color:var(--ok)}
.ck .h{display:block;color:var(--muted);font-size:14px;font-weight:400;margin-top:2px}
.ck .who{display:block;color:var(--ok);font-size:13px;font-weight:600}
.ck b{font-weight:700}
.sec{font-weight:800;margin:18px 0 8px;font-size:15px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.rule{background:var(--accent-soft);color:var(--accent-ink);border-radius:12px;padding:10px 12px;margin:8px 0 12px;font-size:15px}
.rule.bad{background:var(--bad-soft);color:var(--bad)}
.rule.info{background:var(--info-soft);color:var(--info)}
.rule.ok{background:var(--ok-soft);color:var(--ok)}
/* Températures */
.trow{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.trow .n{font-weight:700;display:flex;justify-content:space-between;gap:8px;align-items:center}
.tin{display:flex;align-items:center;gap:8px;margin-top:8px}
.tin .sign{width:56px;min-width:56px;height:56px;border-radius:12px;border:2px solid var(--ink);background:#fff;font-size:22px;font-weight:800;cursor:pointer}
.tin .inp{font-size:24px;font-weight:700;max-width:150px}
.tin span{font-weight:700;color:var(--muted)}
.verdict{display:inline-block;padding:5px 10px;border-radius:10px;font-weight:800;border:2px solid;font-size:14px}
.v-ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.v-tol{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.v-bad{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.tval{font-size:22px;font-weight:800}
.tmeta{color:var(--muted);font-size:13px}
.round-h{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px}
.round-h b{font-size:18px}
/* Listes, tableaux, accordéons */
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th{text-align:left;color:var(--muted);font-weight:600;border-bottom:2px solid var(--line);padding:6px 4px}
table.t td{border-bottom:1px solid var(--line);padding:7px 4px;vertical-align:top}
details.acc{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
details.acc>summary{list-style:none;cursor:pointer;padding:14px;min-height:56px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:'＋';font-size:20px;color:var(--accent)}
details.acc[open]>summary::after{content:'－'}
details.acc>div{padding:0 14px 14px}
ol.steps6{counter-reset:s;list-style:none;padding:0;margin:0;display:grid;gap:6px}
ol.steps6 li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
ol.steps6 li::before{content:counter(s);width:30px;height:30px;border-radius:99px;background:var(--ink);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px}
ul.tight{margin:6px 0;padding-left:20px}
ul.tight li{margin:3px 0}
.items{display:grid;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:60px}
.item .t{font-weight:700}
.item .s{color:var(--muted);font-size:14px}
.fam{display:inline-block;border-radius:8px;padding:3px 8px;font-size:13px;font-weight:700;margin:2px 4px 2px 0;border:2px solid}
.fam.dd{border-color:#1257A8;color:#1257A8}.fam.dn{border-color:#2A7A34;color:#2A7A34}.fam.dg{border-color:#B31E1E;color:#B31E1E}
.fam.dt{border-color:#8A4200;color:#8A4200}.fam.sol{border-color:#6B6258;color:#6B6258}.fam.eau{border-color:#4B5A8C;color:#4B5A8C}
.col{display:grid;grid-template-columns:54px 1fr;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.col .sw{height:38px;border-radius:8px;border:2px solid var(--ink)}
/* Allergènes */
.algrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.al{display:flex;align-items:center;gap:8px;min-height:54px;padding:6px 10px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:700;cursor:pointer;text-align:left}
.al.on{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.al .e{font-size:22px}
.prod{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.prod .pn{font-weight:800}
.prod .cat{color:var(--muted);font-size:13px}
.tag{display:inline-block;padding:3px 8px;border-radius:8px;font-size:13px;font-weight:700;margin:3px 4px 0 0}
.tag.c{background:var(--bad-soft);color:var(--bad)}
.tag.tr{background:var(--accent-soft);color:var(--accent-ink)}
.tag.no{background:var(--ok-soft);color:var(--ok)}
.tag.w{background:#FFF4C2;color:#6B5200}
/* Signature, feuilles, toasts */
.sigwrap{border:2px dashed var(--muted);border-radius:12px;background:#fff;position:relative}
.sigwrap canvas{display:block;width:100%;height:200px;touch-action:none;border-radius:12px}
.sigwrap .ph2{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#B8AFA3;pointer-events:none;font-size:18px}
.sigbar{display:flex;justify-content:space-between;align-items:center;margin-top:6px;color:var(--muted);font-size:14px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom)}
.tabs a{min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;font-weight:700;font-size:12px;color:var(--muted);gap:2px}
.tabs a .ic{font-size:22px;line-height:1}
.tabs a.on{color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.sheet-bg{position:fixed;inset:0;background:rgba(31,27,22,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:40;background:var(--ink);color:#fff;border-radius:12px;padding:14px 16px;font-weight:600;text-align:center;opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none;max-width:680px;margin:0 auto}
.toast.show{opacity:1;transform:none}
.toast.err{background:var(--bad)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.nav-btns{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:20px}
.big-date{font-size:30px;font-weight:900;color:var(--accent-ink);line-height:1.1}
.label-prev{border:2px dashed var(--ink);border-radius:10px;padding:10px 12px;background:#fff;font-size:16px;margin-top:10px}
.q{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.q .opts{display:grid;gap:6px;margin-top:8px}
.q .opt{min-height:52px;text-align:left;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:#fff;cursor:pointer;font-weight:600}
.q .opt.good{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.q .opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.q .why{margin-top:8px;font-size:15px}
.charte h4{margin:14px 0 4px;font-size:16px}
.charte ul{margin:4px 0;padding-left:20px}
.charte li{margin:3px 0}
.qr{display:flex;justify-content:center;padding:14px;background:#fff;border-radius:12px}
.empty{color:var(--muted);text-align:center;padding:26px 10px}
dl.kv{display:grid;grid-template-columns:minmax(120px,42%) 1fr;gap:6px 12px;margin:0}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;font-weight:600;word-break:break-word}
@media print{ .top,.tabs,.noprint,#toast{display:none!important} body{padding:0;background:#fff} }
</style>
</head>

<script>
'use strict';
const APP_VERSION = '1.1.0';
const CHARTE_VERSION = '2026-09';

/* ============================================================
   RÉFÉRENTIEL SANITAIRE (R1 — 30/09/2026)
   Sources : charte « Bonnes pratiques d'hygiène en cuisine » AABD, fiches de relevé plats chauds/froids,
   PRO-REC-01 (AR 13/07/2014), PND-BUF-01, procédure Cuissons & Pertes.
   ⚠ Seuils à faire valider par le référent HACCP. Toute modification = nouvelle version (REF.version) :
   chaque mesure enregistre la version appliquée, les anciennes mesures ne sont jamais recalculées.
   ============================================================ */
// R2 : limites légales de l'AR du 13/07/2014 (annexe IV) + cibles internes AABD, affichées séparément.
const REF = {
  version: 'R2 · 30/09/2026 (AR 13/07/2014)',
  pos:   { cible: 4, legal: 7 },       // frigos : légal ≤ 7 °C · cible interne ≤ 4 °C (limite plus stricte possible par frigo)
  neg:   { legal: -18, tol: -15 },     // congélateurs : légal ≤ −18 °C · remontée tolérée jusqu'à −15 °C
  froid: { cible: 5, legal: 7, jeter: 10 }, // buffet froid : légal ≤ 7 °C · cible interne ≤ 5 °C
  chaud: { legal: 60, bas: 55, cible: 65 }, // buffet chaud : légal ≥ 60 °C à cœur · cible interne ≥ 65 °C
  lv:    { ok: 85 },                   // lave-vaisselle : rinçage ≥ 85 °C (contrôle hebdomadaire)
  refroid: { t: 10, h: 2 },            // refroidissement : < 10 °C en 2 h max, puis ≤ 7 °C (circulaire AFSCA)
  surplus: { froid: 24, cuit: 48, pain: 24 }, // surplus NON exposés aux clients : durée interne max (h) — AFSCA 24–48 h
  ouverture_jours: 3                   // produit ouvert sans indication sur l'emballage : 3 jours max (charte AABD)
};

const DEFAULTS = {
  enceintes: [
    { n:'Frigo office PDJ', t:'pos' }, { n:'Frigo lait machine à café', t:'pos' },
    { n:'Frigo cuisine 1', t:'pos' }, { n:'Frigo cuisine 2', t:'pos' }, { n:'Congélateur cuisine', t:'neg' }
  ],
  chaud: ['Œufs brouillés', 'Lardons / bacon'],
  froid: ['Charcuterie', 'Fromages', 'Yaourts / fromage blanc', 'Lait (buffet)'],
  rounds: ['07:00', '08:30', '10:00']
};

/* ============================================================
   CONTENU MÉTIER — tiré des documents AABD (checklist PDJ, PND-CUI-01, PND-BUF-01, PRO-REC-01,
   PRO-FLU-01, charte d'hygiène, procédure cuissons, audit hygiène PDJ du 09/09/2026)
   ============================================================ */
const PHASES = [
  { k:'poste', ic:'🧼', t:'Prise de poste', when:'Avant de toucher un aliment', type:'checks', items:[
    ['p1','Mains lavées au savon, 30 secondes','Ongles, poignets, entre les doigts. Séchage au papier.'],
    ['p2','Tenue de travail propre + tablier PDJ','Jamais de tenue civile en service (audit 09/09).'],
    ['p3','Cheveux attachés + charlotte / coiffe',''],
    ['p4','Ni bijou ni montre · GSM personnel au casier','GSM personnel interdit en cuisine, office, plonge, réserve et buffet pendant le service (sauf urgence autorisée).'],
    ['p5','Je suis en état de travailler','Vomissements, diarrhée, fièvre, plaie infectée : je préviens le responsable AVANT de toucher un aliment. Plaie : pansement + gant.'],
    ['p6','Lave-mains accessible et approvisionné','Savon, papier, poubelle à couvercle. Rien devant le lave-mains (audit 09/09).'],
    ['p7','Thermomètre sonde propre et désinfecté',''],
    ['p8','Trousseau de clés PDJ pris',''],
    ['p9','Smartphone de service : chargé, nettoyé, rangé dans son support','Jamais sur un plan de travail, un chariot de denrées ou dans un frigo. Après l\'avoir touché : mains lavées avant de toucher un aliment.']
  ]},
  { k:'t_open', ic:'🌡️', t:'Frigos & congélateurs — ouverture', when:'En arrivant', type:'enceintes', ctx:'open' },
  { k:'cuisson', ic:'🥐', t:'Cuissons', when:'À partir de 4h30', type:'cuisson', items:[
    ['c1','Viennoiseries dégelées au moins 15 min avant cuisson',''],
    ['c2','Maximum 10 pièces par grille, sur papier sulfurisé','Ne jamais mélanger pains et viennoiseries sur une même grille.'],
    ['c3','Quantités selon le calcul (pas de diminution sans accord)',''],
    ['c4','Cuissons refroidies 10 min dans l\'office avant dressage',''],
    ['c5','Omelettes préparées dans la dernière heure (20 min à 160 °C), gardées en cocotte sur l\'induction','']
  ]},
  { k:'miseplace', ic:'🍽️', t:'Mise en place du buffet', when:'Avant 7h00', type:'checks', items:[
    ['m1','Plaque froide allumée AVANT d\'y poser les produits',''],
    ['m2','Machine à café allumée, bacs remplis (café, cacao, lait)','Le lait reste au froid : relever aussi le frigo lait.'],
    ['m3','Machine à jus allumée',''],
    ['m4','Cuiseur à œufs allumé, eau entre MIN et MAX','Mollets 3 min · durs 9 min.'],
    ['m5','Buffet dressé : tout est présent',''],
    ['m6','Charcuterie, fromages, lait, jus sortis au DERNIER moment, posés sur la plaque froide','Contrôle HACCP : jamais en avance.'],
    ['m7','Plats chauds sur l\'induction allumée, couvercles en place',''],
    ['m8','Une pince / un couvert de service propre par produit',''],
    ['m9','Affiche « Information allergènes » visible',''],
    ['m10','Tables et chaises propres et alignées (et la cour si ouverte)',''],
    ['m11','Télévision allumée (La Une ou France 24) · liste des PDJ prise','']
  ]},

/* ============================================================
   Stockage local unique (IndexedDB) — toute la persistance passe ici
   ============================================================ */
const Store = (() => {
  const DB = 'aabd-pdj', VER = 1;
  let dbp = null;
  function open(){
    if (dbp) return dbp;
    dbp = new Promise((res, rej) => {
      const r = indexedDB.open(DB, VER);
      r.onupgradeneeded = () => {
        const db = r.result;
        ['services:id','outbox:eventId','engagements:id'].forEach(s => { const [n, k] = s.split(':'); if (!db.objectStoreNames.contains(n)) db.createObjectStore(n, { keyPath:k }); });
        if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta');
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  async function run(store, mode, fn){
    const db = await open();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, mode);
      const req = fn(tx.objectStore(store));
      let out;
      if (req) req.onsuccess = () => { out = req.result; };
      tx.oncomplete = () => res(out);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error || new Error('Transaction annulée'));
    });
  }
  return {
    all: s => run(s, 'readonly', st => st.getAll()),
    get: (s, k) => run(s, 'readonly', st => st.get(k)),
    put: (s, v, k) => run(s, 'readwrite', st => k === undefined ? st.put(v) : st.put(v, k)),
    del: (s, k) => run(s, 'readwrite', st => st.delete(k))
  };
})();

const DTF = new Intl.DateTimeFormat('fr-BE', { timeZone:TZ, day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', hourCycle:'h23', weekday:'short' });
function parts(iso){ const p = {}; DTF.formatToParts(iso ? new Date(iso) : new Date()).forEach(x => p[x.type] = x.value); return p; }
function fmt(iso){ if (!iso) return '—'; const p = parts(iso); return `${p.day}/${p.month}/${p.year} ${p.hour}:${p.minute}`; }
const fmtD = iso => fmt(iso).slice(0, 10);
const fmtH = iso => iso ? fmt(iso).slice(11) : '—';
const ymd = iso => { const p = parts(iso); return `${p.year}-${p.month}-${p.day}`; };
const ymdFr = s => s ? s.split('-').reverse().join('/') : '—';
const weekday = iso => new Date(new Date(iso || Date.now()).toLocaleString('en-US', { timeZone:TZ })).getDay();
const nowHM = () => { const p = parts(); return `${p.hour}:${p.minute}`; };
const longDate = iso => new Date(iso || Date.now()).toLocaleDateString('fr-BE', { timeZone:TZ, weekday:'long', day:'numeric', month:'long' });
const daysBetween = (a, b) => Math.floor((new Date(b) - new Date(a)) / 86400000);
const normName = s => String(s || '').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ');
const initials = n => String(n || '').split(/[\s-]+/).filter(Boolean).map(w => w[0].toUpperCase()).join('');
const toNum = v => { const n = parseFloat(String(v ?? '').replace(/−/g, '-').replace(',', '.').trim()); return Number.isFinite(n) ? n : null; };
const fmtT = n => n === null || n === undefined ? '—' : String(n).replace('.', ',').replace('-', '−') + ' °C';
const fmtN = n => String(n).replace('.', ',');
function toast(msg, err=false){

  clearTimeout(toast._t); toast._t = setTimeout(() => el.className = 'toast', err ? 4200 : 2600);
}
function chips(group, options, selected, multi){
  const sel = multi ? (selected || []) : [selected];
  return `<div class="chips" data-group="${group}" ${multi ? 'data-multi' : ''}>${options.map(o => `<button type="button" class="chip${sel.includes(o) ? ' on' : ''}" data-v="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
}
function bindChips(root, group, onPick){
  const g = $(`[data-group="${group}"]`, root); if (!g) return;
  const multi = g.hasAttribute('data-multi');
  g.addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    if (multi) b.classList.toggle('on'); else { $$('.chip', g).forEach(c => c.classList.toggle('on', c === b)); }
    onPick(multi ? $$('.chip.on', g).map(c => c.dataset.v) : b.dataset.v);
  });
}
function stepper(name, value, step=1, small=false){
  return `<div class="stepper${small ? ' small-stepper' : ''}" data-stepper="${esc(name)}" data-step="${step}"><button type="button" data-d="-1" aria-label="moins">−</button>
    <input inputmode="decimal" value="${esc(value ?? '')}" aria-label="${esc(name)}"><button type="button" data-d="1" aria-label="plus">+</button></div>`;
}
function bindSteppers(root, onChange){
  $$('[data-stepper]', root).forEach(st => {
    const inp = $('input', st), step = parseFloat(st.dataset.step);
    const set = v => { v = Math.max(0, step % 1 ? Math.round(v * 10) / 10 : Math.round(v)); inp.value = fmtN(v); onChange(st.dataset.stepper, v); };
    $$('button', st).forEach(b => b.onclick = () => set((toNum(inp.value) || 0) + step * +b.dataset.d));
    inp.onchange = () => { const v = toNum(inp.value); if (v === null) { inp.value = ''; onChange(st.dataset.stepper, null); } else set(v); };
  });
}

/* ---------- Photos ---------- */
async function compressImage(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 1400, r = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.7);
  } finally { URL.revokeObjectURL(url); }
}
function takePhoto(){
  return new Promise(res => {
    const inp = $('#cam'); inp.value = '';
    inp.onchange = async () => { const f = inp.files && inp.files[0]; res(f ? await compressImage(f) : null); };
    inp.click();
  });
}

/* ---------- Signature au doigt ---------- */
function mountSignature(canvas, onChange){
  const dpr = Math.max(1, window.devicePixelRatio || 1);
  const r = canvas.getBoundingClientRect();
  canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
  const ctx = canvas.getContext('2d');
  ctx.lineWidth = 2.6 * dpr; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111';
  let drawing = false, last = null, ink = 0;
  const pos = e => { const b = canvas.getBoundingClientRect(); return { x:(e.clientX - b.left) * dpr, y:(e.clientY - b.top) * dpr }; };

  canvas.addEventListener('pointermove', e => {
    if (!drawing) return;
    const p = pos(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    ink += Math.hypot(p.x - last.x, p.y - last.y) / dpr; last = p; e.preventDefault();
  });
  const end = () => { if (drawing) { drawing = false; onChange && onChange(); } };
  ['pointerup','pointercancel','pointerleave'].forEach(ev => canvas.addEventListener(ev, end));
  return {
    isEmpty: () => ink < 25,
    clear(){ ctx.clearRect(0, 0, canvas.width, canvas.height); ink = 0; onChange && onChange(); },
    toPng(){
      const w = 600, h = Math.round(canvas.height * w / canvas.width);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(canvas, 0, 0, w, h);

    const lab = legal < R.pos.legal ? `limite de ce frigo ${fmtT(legal)}` : 'limite légale 7 °C';
    if (v <= cible) return { verdict:'Conforme', cls:'ok' };
    if (v <= legal) return { verdict:'À surveiller', cls:'tol', msg:`Conforme (${lab}) mais au-dessus de la cible interne (${fmtT(cible)}) : vérifiez porte, joint, chargement et réglage. Re-mesurez plus tard.` };
    return { verdict:'Non conforme', cls:'bad', critical:true, msg:`Au-dessus de la ${lab}.`, todo:['Ne servez aucun produit sensible de ce frigo','Transférez les produits dans un autre frigo froid, ou isolez-les avec « NE PAS UTILISER »','Prévenez le responsable : c\'est lui qui décide du rebut','Cherchez la cause : porte mal fermée, joint, frigo trop chargé, panne','Re-mesurez dans 30 minutes'],

  }
  if (kind === 'neg'){
    if (v <= R.neg.legal) return { verdict:'Conforme', cls:'ok' };
    if (v <= R.neg.tol) return { verdict:'À surveiller', cls:'tol', msg:'Au-dessus de −18 °C (remontée tolérée jusqu\'à −15 °C) : porte bien fermée ? givre ? Re-mesurez plus tard.' };

    if (v <= R.froid.cible) return { verdict:'Conforme', cls:'ok' };

      todo:['Retirez le produit exposé et jetez-le : il ne retourne pas au frigo','Remplacez-le par une petite quantité sortie du frigo','Corrigez la cause (plaque froide allumée ? produit bien posé dessus ?)','Prévenez le responsable si la plaque froide ne refroidit pas'],
      actions:['Produit jeté et remplacé','Produit jeté, plus servi'], causes };
  }

    if (v >= R.chaud.legal) return { verdict:'À surveiller', cls:'tol', msg:'Conforme à la loi (≥ 60 °C) mais sous la cible interne (65 °C) : montez un peu l\'induction, gardez le couvercle.' };
    if (v >= R.chaud.bas) return { verdict:'Écart', cls:'tol', msg:'Sous la limite légale de 60 °C.', todo:['Réchauffez immédiatement (induction plus forte, couvercle) jusqu\'à 65 °C','Re-mesurez : toujours sous 60 °C → on jette'],
      actions:['Réchauffé — re-mesure à faire'], causes:['Induction trop basse','Pas de couvercle','Bac resté trop longtemps','Autre'], remeasure:true, mustRemeasure:true };

  }

// Statut d'une phase
function phaseStatus(p, st){
  const s = S;
  const ecartIn = keys => s.ecarts.some(e => keys.includes(e.ctx));
  if (['checks','dlc','cuisson','nettoyage','debarras'].includes(p.type)){
    const n = p.items.length, d = p.items.filter(i => s.checks[p.k + '.' + i[0]]).length;
    return { done:d, total:n, state: d === n ? 'ok' : d ? 'run' : 'todo', txt: `${d}/${n}` };
  }
  // Une phase de relevés est « faite » quand tout est mesuré ; « fait · écart » s'il y a eu un écart (traité)
  const tState = (d, n, bad) => d === n ? (bad ? 'bad' : 'ok') : d ? 'run' : 'todo';
  if (p.type === 'enceintes'){
    const n = st.enceintes.length, got = st.enceintes.map(e => getTemp(p.ctx, e.n)).filter(Boolean);
    return { done:got.length, total:n, state: tState(got.length, n, got.some(t => t.cls === 'bad')), txt:`${got.length}/${n}` };
  }
  if (p.type === 'buffet'){
    const objs = st.chaud.concat(st.froid), rs = ['r1','r2','r3'];
    let d = 0; rs.forEach(r => objs.forEach(o => { if (getTemp(r, o)) d++; }));
    const bad = s.temps.some(t => rs.includes(t.ctx) && t.cls !== 'ok');
    return { done:d, total:objs.length * 3, state: tState(d, objs.length * 3, bad), txt:`${d}/${objs.length * 3}` };
  }
  if (p.type === 'cloture') return { state: s.closedAt ? 'ok' : 'todo', txt: s.closedAt ? 'Clôturé' : 'À faire' };
  return { state:'todo', txt:'' };
}

/* ---------- Nettoyages périodiques : échéances ---------- */
// Tâche jamais enregistrée : on part d'une date de référence décalée selon la tâche,
// pour étaler les échéances au démarrage au lieu de tout demander le premier jour.
const PLAN_EPOCH = '2026-10-01';
function virtualLast(p){
  let h = 0; for (const c of p.k) h = (h * 31 + c.charCodeAt(0)) % 997;
  const d = new Date(PLAN_EPOCH + 'T12:00:00'); d.setDate(d.getDate() - (h % FREQ[p.f].d));
  return d.toISOString().slice(0, 10);
}
function periodicInfo(p, etat, today){
  const local = S && S.periodic[p.k];
  const remote = etat.data.periodic && etat.data.periodic[p.k];
  const real = [local && local.at, remote && remote.at].filter(Boolean).sort().pop() || null;
  const last = real || (p.day === undefined ? virtualLast(p) : null);
  const age = last ? daysBetween(ymd(last), today) : null;
  const per = FREQ[p.f].d, wd = weekday(today + 'T12:00:00');
  let due = false, late = false;
  if (p.day !== undefined){
    if (wd === p.day && (age === null || age >= 5)) due = true;
    if (age === null ? false : age > per + 1) { due = true; late = true; }
    if (age === null && wd !== p.day) { due = false; }
  } else {
    if (age === null || age >= per) due = true;
    if (age !== null && age > per + 2) late = true;
  }
  return { last: real, age, due, late: late && !!real, doneToday: !!(local && local.at) };
}
function dueToday(etat){
  const today = S ? S.date : ymd();
  return PERIODIC.map(p => Object.assign({ p }, periodicInfo(p, etat, today))).filter(x => x.due || x.doneToday);
}

async function queue(kind, payload, attachments){
  const ev = { eventId: kind + '-' + uid(), kind, createdAt: nowIso(), tries:0, lastError:'', payload: Object.assign({ kind }, payload), attachments: attachments || [] };
  ev.payload.eventId = ev.eventId;

let flushing = false;
async function relay(body){
  const s = await getSettings();
  const r = await fetch(s.relayUrl, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({}, body, { token:s.token })) });
  const j = await r.json().catch(() => ({ ok:false, error:'Réponse illisible du relais (HTTP ' + r.status + ')' }));
  if (!j.ok) throw new Error(j.error || 'Refusé par le relais');
  return j;
}
async function flushOutbox(){
  if (flushing) return;
  const s = await getSettings();
  if (!s.relayUrl || !s.token || !navigator.onLine) { refreshChrome(); return; }
  flushing = true;
  let sent = 0;
  try {
    const items = (await Store.all('outbox')).sort((a, b) => a.createdAt.localeCompare(b.createdAt));
    for (const ev of items){
      try {
        await relay(Object.assign({}, ev.payload, { attachments: ev.attachments }));
        await Store.del('outbox', ev.eventId); sent++;
        if (ev.kind === 'cloture'){ const sv = await Store.get('services', ev.payload.report.id); if (sv){ sv.sentAt = nowIso(); await Store.put('services', sv); } }
        if (ev.kind === 'engagement'){ const en = await Store.get('engagements', ev.payload.engagement.id); if (en){ en.sentAt = nowIso(); await Store.put('engagements', en); } }
      } catch(e){
        ev.tries++; ev.lastError = String(e.message || e); ev.lastTry = nowIso();
        await Store.put('outbox', ev);
        break;
      }
    }
  } finally {
    flushing = false;
    refreshChrome();
    if (sent) { await fetchEtat(); rerenderSoft(); }
  }
}
async function fetchEtat(){
  const s = await getSettings();
  if (!s.relayUrl || !s.token || !navigator.onLine) return;
  try {
    const j = await relay({ kind:'etat' });
    const remote = j.etat || { engagements:[], periodic:{}, handover:null }, local = (await getEtat()).data;
    // Fusion : on garde la date la plus récente (un envoi local peut encore être en attente)
    const periodic = Object.assign({}, remote.periodic || {});
    Object.entries(local.periodic || {}).forEach(([k, v]) => { if (!periodic[k] || String(periodic[k].at) < String(v.at)) periodic[k] = v; });
    const handover = [remote.handover, local.handover].filter(Boolean).sort((a, b) => String(b.at).localeCompare(String(a.at)))[0] || null;
    await Store.put('meta', { at: nowIso(), data: { engagements: remote.engagements || [], periodic, handover } }, 'etat');
  } catch(e){ /* hors ligne ou relais indisponible : on garde la copie locale */ }
}

function wireTemps(){
  $$('[data-sign]').forEach(b => b.onclick = () => { const i = b.parentElement.querySelector('input'); const v = i.value.trim(); i.value = v.startsWith('-') || v.startsWith('−') ? v.slice(1) : '-' + v; i.focus(); });
  $$('[data-tok]').forEach(b => b.onclick = () => {
    const inp = b.parentElement.querySelector('input'), v = toNum(inp.value);
    if (v === null) return toast('Tapez la température mesurée', true);
    const [ctx, ...rest] = b.dataset.tok.split('|');
    recordTemp(ctx, rest.join('|'), b.dataset.kind, v, b.dataset.ctxl, null, toNum(b.dataset.lim));
  });
  $$('[data-re]').forEach(b => b.onclick = () => openRemeasure(b.dataset.re, b.dataset.kind));
  $$('[data-fix]').forEach(b => b.onclick = () => openFix(b.dataset.fix, b.dataset.kind));

async function recordTemp(ctx, obj, kind, v, ctxLabel, hist, lim){
  const [lo, hi] = PLAUSIBLE[kind];
  if ((v < lo || v > hi) && !confirm(`${fmtT(v)} pour « ${obj} » : valeur inhabituelle. Confirmez-vous cette mesure ?`)) return false;
  const ev = evalT(kind, v, lim);
  const t = { lim, key:tempKey(ctx, obj), ctx, ctxLabel, obj, kind, v, at:nowIso(), by:S.operator, verdict:ev.verdict, cls:ev.cls, msg:ev.msg || '', ref:REF.version, mustRemeasure:!!ev.mustRemeasure };
  if (hist) t.hist = hist;
  const put = () => { S.temps = S.temps.filter(x => x.key !== t.key); S.temps.push(t); };
  if (!ev.todo){ put(); await saveS(); toast(`${obj} : ${fmtT(v)} — ${ev.verdict}`); return render(true); }
  openEcartSheet({ title:`${obj} : ${fmtT(v)}`, ev, onSave: async (action, cause, note, photo) => {
    t.action = action; t.cause = cause; t.note = note;
    put();
    await addEcart({ ctx, cat:'Température', obj:`${obj} (${KIND_LABEL[kind]}, ${ctxLabel})`, val:fmtT(v), verdict:ev.verdict, action, cause, note, photo, critical:!!ev.critical });
    render(true);
  }});
}

function closeSheet(){ $('#sheet').innerHTML = ''; }
async function addEcart(e){

  S.ecarts.push(rec);
  if (rec.critical || rec.direct){
    rec.direct = true;

function openRemeasure(key, kind){
  const t = S.temps.find(x => x.key === key); if (!t) return;
  $('#sheet').innerHTML = `<div class="sheet-bg"><div class="sheet"><div class="sheet-head"><h3 style="margin:0">Re-mesure : ${esc(t.obj)}</h3><button class="btn small ghost" data-close>✕</button></div>

    <div class="tin"><button type="button" class="sign" data-sign>±</button><input class="inp" inputmode="decimal" id="rev"><span>°C</span></div>
    <button class="btn block primary" style="margin-top:14px" id="resave">Enregistrer la re-mesure</button></div></div>`;
  const sh = $('#sheet');
  $('[data-close]', sh).onclick = closeSheet;
  $('[data-sign]', sh).onclick = () => { const i = $('#rev'); const v = i.value.trim(); i.value = v.startsWith('-') ? v.slice(1) : '-' + v; };
  $('#resave').onclick = async () => {
    const v = toNum($('#rev').value); if (v === null) return toast('Tapez la température', true);
    const ev = evalT(kind, v, t.lim);
    if (t.re) t.hist = (t.hist || []).concat([{ v:t.re.v, verdict:t.re.verdict, at:t.re.at, motif:'re-mesure précédente', by:t.re.by }]);
    t.re = { v, at:nowIso(), verdict:ev.verdict, cls:ev.cls, by:S.operator };
    closeSheet();
    if (kind === 'chaud' && v < REF.chaud.legal){
      t.re.verdict = 'Non conforme'; t.re.cls = 'bad';
      await addEcart({ ctx:t.ctx, cat:'Température', obj:`${t.obj} (re-mesure)`, val:fmtT(v), verdict:'Non conforme', action:'Toujours sous 60 °C après réchauffage : jeté et remplacé par un bac neuf', critical:true });
      toast('Toujours sous 60 °C : jetez et remettez un bac neuf', true);
    } else if (ev.todo && ev.cls === 'bad'){
      await addEcart({ ctx:t.ctx, cat:'Température', obj:`${t.obj} (re-mesure)`, val:fmtT(v), verdict:ev.verdict, action:'Toujours non conforme à la re-mesure — responsable à prévenir', critical:true });
    } else { toast(`Re-mesure : ${fmtT(v)} — ${ev.verdict}`); }
    await saveS(); render(true);

function openFix(key, kind){
  const t = S.temps.find(x => x.key === key); if (!t) return;
  $('#sheet').innerHTML = `<div class="sheet-bg"><div class="sheet"><div class="sheet-head"><h3 style="margin:0">Corriger une erreur de saisie</h3><button class="btn small ghost" data-close>✕</button></div>

    <button class="btn block primary" style="margin-top:14px" id="fixsave">Corriger</button></div></div>`;
  const sh = $('#sheet');

}

function nonFaits(st){
  const out = [];
  PHASES.forEach(p => {
    if (p.items) p.items.forEach(it => { if (!S.checks[p.k + '.' + it[0]]) out.push(`${p.t} : ${it[1]}`); });
    if (p.type === 'enceintes') st.enceintes.forEach(e => { if (!getTemp(p.ctx, e.n)) out.push(`Température non relevée : ${e.n} (${p.ctx === 'open' ? 'ouverture' : 'fin'})`); });
    if (p.type === 'buffet') ['r1','r2','r3'].forEach((r, i) => st.chaud.concat(st.froid).forEach(o => { if (!getTemp(r, o)) out.push(`Température non relevée : ${o} (${st.rounds[i]})`); }));
  });
  return out;
}

    </div>
    <div class="card"><h3>Écarts du service (${S.ecarts.length})</h3>
      ${S.ecarts.length ? `<ul class="tight">${S.ecarts.map(e => `<li><b>${esc(e.obj || e.cat)}</b>${e.val ? ' ' + esc(e.val) : ''} — ${esc(e.action || '')}</li>`).join('')}</ul>` : '<p class="muted">Aucun écart enregistré.</p>'}</div>
    ${nf.length || dueNotDone.length ? `<div class="card"><h3>Non réalisé (${nf.length + dueNotDone.length})</h3>
      <ul class="tight small">${nf.concat(dueNotDone.map(x => 'Nettoyage périodique : ' + x.p.t)).map(x => `<li>${esc(x)}</li>`).join('')}</ul>
      <p class="small muted">Un contrôle non fait n'est jamais « conforme » : il part tel quel dans le rapport.</p>
      <label class="f">Pourquoi ? <span class="opt">(obligatoire)</span></label><textarea class="inp" id="nfm">${esc(S.nonFaitMotif)}</textarea></div>` : ''}
    <div class="card"><h3>Passation</h3>
      <label class="f">Message pour le prochain PDJ et la réception</label><textarea class="inp" id="handover" placeholder="ex. plus de lait soja, machine à jus bruyante, 2 groupes demain…">${esc(S.handover)}</textarea></div>
    <div class="card"><h3>Signature</h3><p class="small muted" style="margin-top:-6px">${esc(S.operator)} — je certifie l'exactitude de ces relevés.</p>${signatureBlock()}</div>

    const df = cc.factures === undefined || cc.factures === null ? null : co - (cc.offerts || 0) - cc.factures;
    $('#diffbox').className = 'rule ' + (df ? 'bad' : 'info'); $('#diffbox').innerHTML = `Total consommés : <b>${co}</b>${df !== null ? ` · différence consommés payants − facturés : <b>${df}</b>` : ''}`; };
  bindSteppers(V, async (k, v) => { if (k.startsWith('loss:')) { S.losses[k.slice(5)] = v; await saveS(); } else upd(k, v); });

    if (co - (cc.offerts || 0) - cc.factures !== 0 && !cc.explication) return toast('Expliquez la différence consommés / facturés', true);
    if ((nf.length || dueNotDone.length) && !S.nonFaitMotif) return toast('Indiquez pourquoi certaines tâches n\'ont pas été faites', true);
    if (sig.isEmpty()) return toast('Signature obligatoire', true);
    if (!confirm('Clôturer le service ? Il ne sera plus modifiable.')) return;
    S.signature = sig.toPng(); S.closedAt = nowIso();
    const report = buildReport(st, etat, nf, dueNotDone);
    S.report = report;
    await saveS();
    const att = [{ name:`${S.id} signature.png`, mime:'image/png', data:S.signature.split(',')[1] }];

    Object.entries(S.periodic).forEach(([k, v]) => { et.data.periodic[k] = v; });
    et.data.handover = handoverOf(report);
    await Store.put('meta', et, 'etat');
    const done = S; S = null;

      <a class="btn block primary" href="#/">Terminé</a></div>`;
  };
}
// Même format que celui calculé par le relais (Code.gs → passation_)
function handoverOf(r){
  return { at:r.closedAt, by:r.operator, serviceId:r.id, note:r.handover, missing:r.missing,
    ecarts:r.ecarts.slice(0, 8).map(e => `${e.obj || e.cat}${e.val ? ' ' + e.val : ''} — ${e.action || ''}`),
    nonFait:r.nonFait.slice(0, 8) };
}
function buildReport(st, etat, nf, dueNotDone){
  const c = S.counts, conso = (c.adultes || 0) + (c.enfants || 0) + (c.offerts || 0);
  const checks = [];
  PHASES.forEach(p => (p.items || []).forEach(it => { const k = p.k + '.' + it[0], v = S.checks[k]; checks.push({ phase:p.t, label:it[1], status:v ? 'Fait' : 'Non fait', at:v ? v.at : '', by:v ? v.by : '' }); }));
  const periodic = dueToday(etat).map(x => ({ k:x.p.k, t:x.p.t, freq:FREQ[x.p.f].l, status:S.periodic[x.p.k] ? 'Fait' : 'Non fait', at:S.periodic[x.p.k] ? S.periodic[x.p.k].at : '', by:S.periodic[x.p.k] ? S.periodic[x.p.k].by : '' }));
  const losses = [];
  LOSSES.forEach(([g, u, list]) => list.forEach(n => { if (S.losses[n]) losses.push({ p:n, q:S.losses[n], u, m:'Non consommé' }); }));
  S.retires.forEach(r => losses.push({ p:r.p, q:r.q, u:'', m:r.m }));
  const temps = S.temps.map(t => ({ ctx:t.ctxLabel, obj:t.obj, kind:KIND_LABEL[t.kind], v:t.v, at:t.at, by:t.by, verdict:t.verdict, action:t.action || '', cause:t.cause || '', note:t.note || '',
    re: t.re ? { v:t.re.v, at:t.re.at, verdict:t.re.verdict } : null, hist:t.hist || [], ref:t.ref }));
  const ecarts = S.ecarts.map(e => ({ id:e.id, at:e.at, by:e.by, cat:e.cat, obj:e.obj, val:e.val, verdict:e.verdict, action:e.action, cause:e.cause || '', note:e.note || '', direct:!!e.direct, photo:!!e.photo }));
  return { id:S.id, date:S.date, operator:S.operator, team:(S.team || []).map(t => t.name + ' (' + fmtH(t.at) + ')'), cookBy:S.cook.by, cookQty:S.cook.qty, startedAt:S.startedAt, closedAt:S.closedAt, reserved:S.reserved,
    weekend:S.weekend, holiday:S.holiday,
    counts:{ adultes:c.adultes || 0, enfants:c.enfants || 0, offerts:c.offerts || 0, total:conso, factures:c.factures, annulations:c.annulations || 0, diff: conso - (c.offerts || 0) - (c.factures || 0), explication:c.explication || '' },
    temps, checks, periodic, losses, surplus:(S.surplus || []).map(x => ({ p:x.p, q:x.q, type:SURPLUS_TYPES[x.type], dest:x.dest, at:x.at, until:x.until, by:x.by })), missing:S.missing.concat(S.missingOther ? [S.missingOther] : []), handover:S.handover,
    nonFait: nf.concat(dueNotDone.map(x => 'Nettoyage périodique : ' + x.p.t)), nonFaitMotif:S.nonFaitMotif, ecarts,
    result: S.ecarts.length || nf.length ? 'Écarts' : 'Conforme', ref:REF.version, app:APP_VERSION };
}

async function markPeriodicStandalone(k){
  const names = await staffNames();
  let who = '';
  $('#sheet').innerHTML = `<div class="sheet-bg"><div class="sheet"><div class="sheet-head"><h3 style="margin:0">${esc(PER[k].t)}</h3><button class="btn small ghost" data-close>✕</button></div>
    <label class="f">Fait par</label>${names.length ? chips('pw', names, '') : ''}<input class="inp" id="pwn" placeholder="Prénom Nom" style="margin-top:8px">
    <button class="btn block primary" style="margin-top:14px" id="pwok">Enregistrer</button></div></div>`;
  const sh = $('#sheet');
  $('[data-close]', sh).onclick = closeSheet;
  bindChips(sh, 'pw', v => { who = v; $('#pwn').value = v; });
  $('#pwok').onclick = async () => {
    who = $('#pwn').value.trim(); if (!who) return toast('Qui l\'a fait ?', true);
    const at = nowIso();
    const etat = await getEtat(); etat.data.periodic = etat.data.periodic || {}; etat.data.periodic[k] = { at, by:who }; await Store.put('meta', etat, 'etat');
    await queue('tache', { tache:{ k, t:PER[k].t, freq:FREQ[PER[k].f].l, at, by:who } });
    closeSheet(); toast('Enregistré'); render(true);
  };
}

  V.innerHTML = `<h2>⚠️ Allergènes</h2><p class="hint">Aide-mémoire du buffet et du shop. Mise à jour des fiches : 01/09/2026.</p>
    <details class="acc" open><summary>Un client signale une allergie : que faire ?</summary><div><ol class="steps6">
      <li>Écouter : quel allergène ? Allergie grave ?</li>
      <li>Ne jamais répondre de mémoire : consulter cette liste <b>et</b> l'étiquette du produit.</li>
      <li>« Traces possibles » = déconseillé à une personne allergique.</li>
      <li>Buffet en libre-service : des miettes ou une pince peuvent contaminer. Proposer un produit emballé individuellement ou servi depuis la réserve.</li>
      <li>Préparer à part : mains lavées, gants neufs, ustensiles et assiette propres, produit sorti d'un emballage neuf.</li>
      <li>Information « à vérifier » ou doute : ne pas servir, prévenir le responsable ou la réception.</li>
      <li>Réaction (gonflement, difficulté à respirer, malaise) : appeler le <b>112</b>, prévenir la réception, ne pas laisser la personne seule. Si elle a un auto-injecteur d'adrénaline, l'aider à l'utiliser.</li></ol></div></details>
    <div class="sec">Filtrer par allergène</div>
    <div class="algrid">${AL.map(a => `<button class="al${alSel.includes(a[0]) ? ' on' : ''}" data-al="${a[0]}"><span class="e">${a[1]}</span><span>${esc(a[2])}${a[3] ? `<br><span class="small muted" style="font-weight:400">${esc(a[3])}</span>` : ''}</span></button>`).join('')}</div>
    <input class="inp" id="alq" placeholder="Rechercher un produit" value="${esc(alQ)}" style="margin:12px 0">
    ${alSel.length ? `<div class="rule">Produits qui <b>contiennent</b> ou <b>peuvent contenir</b> : ${alSel.map(a => ALN[a][2]).join(', ')} — à éviter pour ce client. Les produits « à vérifier » sont aussi listés.</div>` : ''}
    ${cats.map(c => `<div class="sec">${esc(c)}</div>` + list.filter(p => p[1] === c).map(p => `<div class="prod"><div class="pn">${esc(p[0])}</div>
      <div>${p[2].map(a => `<span class="tag c">${ALN[a][1]} ${esc(ALN[a][2])}</span>`).join('')}${p[3].map(a => `<span class="tag tr">Traces : ${esc(ALN[a][2])}</span>`).join('')}
      ${!p[2].length && !p[3].length && p[4] !== 'x' ? '<span class="tag no">Aucun allergène déclaré</span>' : ''}${p[4] ? `<span class="tag w">⚠ ${esc(ST_LABEL[p[4]])}</span>` : ''}</div>
      ${p[5] ? `<div class="small muted" style="margin-top:4px">${esc(p[5])}</div>` : ''}</div>`).join('')).join('') || '<p class="empty">Aucun produit.</p>'}
    <p class="small muted" style="margin-top:14px">Informations tirées des fiches fournisseurs disponibles ; elles peuvent changer avec la référence livrée. En cas de doute : l'étiquette du produit fait foi, et on ne garantit jamais « sans ».</p>`;
  $$('[data-al]').forEach(b => b.onclick = () => { const k = b.dataset.al; alSel = alSel.includes(k) ? alSel.filter(x => x !== k) : alSel.concat(k); render(true); });

async function viewPlus(){
  const ob = await Store.all('outbox');
  V.innerHTML = await banners() + `<h2>☰ Plus</h2>
    <div class="items">
      <a class="item" href="#/charte"><span><span class="t">📝 Engagement hygiène</span><br><span class="s">Lire la charte et la signer</span></span><span>›</span></a>
      <a class="item" href="#/engage"><span><span class="t">👥 Engagements signés</span><br><span class="s">Qui a signé, et quand</span></span><span>›</span></a>
      <a class="item" href="#/hist"><span><span class="t">🗂️ Services sur ce GSM</span><br><span class="s">Historique et rapports envoyés</span></span><span>›</span></a>
      <a class="item" href="#/config"><span><span class="t">📱 Installer sur un autre GSM</span><br><span class="s">QR code de l'app et de la configuration</span></span><span>›</span></a>
      <a class="item" href="#/settings"><span><span class="t">⚙️ Réglages</span><br><span class="s">Responsable : frigos, buffet, horaires, thermomètre, relais</span></span><span>›</span></a>
    </div>
    <p class="small muted" style="margin-top:16px">Version ${APP_VERSION} · référentiel ${esc(REF.version)} · charte ${CHARTE_VERSION}${ob.length ? ' · ' + ob.length + ' envoi(s) en attente' : ''}</p>`;
  wireBanners();
}

let quizAns = {};
async function viewCharte(){
  const names = await staffNames();
  const allGood = QUIZ.every((q, i) => quizAns[i] === q[2]);
  let who = pick.name || '', fn = '';
  V.innerHTML = `<a href="javascript:history.back()" class="small muted">← Retour</a>
    <h2>📝 Engagement hygiène et sécurité alimentaire</h2><p class="hint">Petit-déjeuner · Adagio Access Brussels Delta · version ${CHARTE_VERSION}</p>
    <div class="card charte">${CHARTE.map(([t, l]) => `<h4>${esc(t)}</h4><ul>${l.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`).join('')}</div>
    <h3>Vérifions ensemble (${QUIZ.length} questions)</h3><p class="small muted" style="margin-top:-6px">Toutes les réponses doivent être justes pour signer. Vous pouvez recommencer.</p>
    ${QUIZ.map((q, i) => { const a = quizAns[i];
      return `<div class="q"><b>${i + 1}. ${esc(q[0])}</b><div class="opts">${q[1].map((o, j) => `<button class="opt${a === j ? (j === q[2] ? ' good' : ' wrong') : ''}" data-q="${i}" data-a="${j}">${esc(o)}</button>`).join('')}</div>
      ${a !== undefined ? `<div class="why ${a === q[2] ? '' : ''}">${a === q[2] ? '✅ ' : '❌ Pas tout à fait. '}${esc(q[3])}</div>` : ''}</div>`; }).join('')}
    <div class="card" ${allGood ? '' : 'style="opacity:.5;pointer-events:none"'}>
      <h3>Je m'engage</h3>
      <p>Je déclare avoir lu et compris ces règles. Je m'engage à les appliquer, à contrôler, corriger et noter toute anomalie.</p>
      <label class="f">Prénom et nom</label>${names.length ? chips('cw', names, who) : ''}<input class="inp" id="cwn" value="${esc(who)}" placeholder="Prénom Nom" style="margin-top:8px">
      <label class="f">Fonction</label>${chips('cf', FONCTIONS, fn)}
      <label class="f">Signature</label>${signatureBlock()}
      <button class="btn block primary" style="margin-top:14px" id="csign">Signer l'engagement</button>
    </div>`;
  $$('[data-q]').forEach(b => b.onclick = () => { quizAns[+b.dataset.q] = +b.dataset.a; render(true); });
  bindChips(V, 'cw', v => { $('#cwn').value = v; });
  bindChips(V, 'cf', v => { fn = v; });
  const sig = wireSignature(V);
  $('#csign').onclick = async () => {
    const name = $('#cwn').value.trim();
    if (name.split(/\s+/).length < 2) return toast('Prénom et nom', true);
    if (!fn) return toast('Choisissez votre fonction', true);
    if (sig.isEmpty()) return toast('Signature obligatoire', true);
    const e = { id:'ENG-' + uid(), name, fonction:fn, at:nowIso(), version:CHARTE_VERSION, quiz:`${QUIZ.length}/${QUIZ.length}`, signature:sig.toPng() };
    await Store.put('engagements', e); await rememberName(name);
    await queue('engagement', { engagement:{ id:e.id, name, fonction:fn, at:e.at, version:e.version, quiz:e.quiz }, charte:CHARTE, quiz:QUIZ.map(q => [q[0], q[1][q[2]]]) },
      [{ name:`Engagement ${name} ${e.at.slice(0, 10)}.png`, mime:'image/png', data:e.signature.split(',')[1] }]);
    quizAns = {}; pick.name = name;
    toast('Merci ! Engagement signé.');
    go('#/');
  };
}
async function viewEngagements(){
  const etat = await getEtat(), loc = await Store.all('engagements');
  const map = new Map();
  (etat.data.engagements || []).concat(loc.map(e => ({ name:e.name, fonction:e.fonction, at:e.at, version:e.version, local:!e.sentAt }))).forEach(e => {
    const k = normName(e.name); if (!map.has(k) || String(map.get(k).at) < String(e.at)) map.set(k, e);
  });
  const rows = [...map.values()].sort((a, b) => a.name.localeCompare(b.name, 'fr'));
  V.innerHTML = `<a href="#/plus" class="small muted">← Plus</a><h2>👥 Engagements signés</h2><p class="hint">Valables 12 mois, et à renouveler si la charte change.</p>
    ${rows.length ? `<div class="items">${rows.map(e => { const age = daysBetween(e.at, nowIso()), ok = age <= 365 && e.version === CHARTE_VERSION;
      return `<div class="item"><span><span class="t">${esc(e.name)}</span><br><span class="s">${esc(e.fonction || '')} · signé le ${fmtD(e.at)}${e.local ? ' · pas encore envoyé' : ''}</span></span><span class="pill ${ok ? 'p-ok' : 'p-bad'}">${ok ? 'Valable' : e.version !== CHARTE_VERSION ? 'À relire' : 'Expiré'}</span></div>`; }).join('')}</div>` : '<p class="empty">Aucun engagement enregistré.</p>'}
    <p class="small muted">${etat.at ? 'Liste du registre mise à jour le ' + fmt(etat.at) : 'Liste du registre pas encore reçue (GSM non relié ou hors ligne).'}</p>`;
}
async function viewHist(){
  const all = (await Store.all('services')).sort((a, b) => b.startedAt.localeCompare(a.startedAt));
  const id = route.args[0];
  if (id){
    const s = all.find(x => x.id === id); if (!s) return go('#/hist');
    const r = s.report;
    V.innerHTML = `<a href="#/hist" class="small muted">← Services</a><h2>${esc(s.id)}</h2><p class="hint">${esc(s.operator)} · ${fmt(s.startedAt)} → ${s.closedAt ? fmt(s.closedAt) : 'en cours'}</p>
      ${r ? `<div class="card"><dl class="kv"><dt>Résultat</dt><dd>${esc(r.result)}</dd><dt>Réservés</dt><dd>${r.reserved}</dd><dt>Consommés</dt><dd>${r.counts.total} (adultes ${r.counts.adultes}, enfants ${r.counts.enfants}, offerts ${r.counts.offerts})</dd><dt>Facturés</dt><dd>${r.counts.factures}</dd><dt>Écarts</dt><dd>${r.ecarts.length}</dd><dt>Non réalisé</dt><dd>${r.nonFait.length}</dd><dt>Rapport</dt><dd>${s.sentAt ? 'Envoyé le ' + fmt(s.sentAt) : 'En attente d\'envoi'}</dd></dl></div>
      <div class="card"><h3>Températures</h3><table class="t">${r.temps.map(t => `<tr><td class="small">${esc(t.ctx)}</td><td>${esc(t.obj)}</td><td><b>${fmtT(t.v)}</b></td><td class="small">${esc(t.verdict)}${t.re ? ' → ' + fmtT(t.re.v) : ''}</td></tr>`).join('')}</table></div>
      ${r.ecarts.length ? `<div class="card"><h3>Écarts</h3><ul class="tight">${r.ecarts.map(e => `<li>${fmtH(e.at)} · <b>${esc(e.obj || e.cat)}</b> ${esc(e.val || '')} — ${esc(e.action || '')}</li>`).join('')}</ul></div>` : ''}
      ${r.handover ? `<div class="card"><h3>Passation</h3><p>${esc(r.handover)}</p></div>` : ''}` : '<p class="muted">Service non clôturé.</p>'}`;
    return;
  }
  V.innerHTML = `<a href="#/plus" class="small muted">← Plus</a><h2>🗂️ Services sur ce GSM</h2>
    ${all.length ? `<div class="items">${all.map(s => `<a class="item" href="#/hist/${encodeURIComponent(s.id)}"><span><span class="t">${esc(fmtD(s.startedAt))} · ${esc(s.operator)}</span><br><span class="s">${s.closedAt ? (s.sentAt ? 'Rapport envoyé ✓' : 'Rapport en attente d\'envoi') : 'En cours'} · ${s.ecarts.length} écart(s)</span></span><span>›</span></a>`).join('')}</div>` : '<p class="empty">Aucun service sur ce GSM.</p>'}
    <p class="small muted">Le registre complet (tous les GSM) est dans le Google Sheet « Registre PDJ & hygiène — AABD ».</p>`;
}

/* ---------- Configuration d'un autre GSM (QR) ---------- */
const QR_URL = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
function loadQr(){ return window.QRCode ? Promise.resolve() : new Promise((res, rej) => { const s = document.createElement('script'); s.src = QR_URL; s.onload = res; s.onerror = () => rej(new Error('QR indisponible hors ligne')); document.head.appendChild(s); }); }
const b64url = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64url = s => decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/'))));
const appBase = () => location.href.split('#')[0];
async function viewConfig(){
  const s = await getSettings();
  const cfgLink = s.relayUrl && s.token ? appBase() + '#cfg=' + b64url(JSON.stringify({ u:s.relayUrl, t:s.token })) : '';
  V.innerHTML = `<a href="#/plus" class="small muted">← Plus</a><h2>📱 Installer sur un autre GSM</h2>
    <div class="card"><h3>1. Ouvrir l'app</h3><p class="small">Scannez ce QR avec l'appareil photo de l'autre GSM, puis menu Chrome ⋮ › « Ajouter à l'écran d'accueil ».</p><div class="qr" id="qr1"></div><p class="small muted" style="word-break:break-all">${esc(appBase())}</p></div>
    <div class="card"><h3>2. Relier au registre</h3>${cfgLink ? `<p class="small">Scannez ce second QR : il relie le GSM au registre (mail, Google Sheet). <b>Ne le partagez pas en dehors de l'équipe.</b></p><button class="btn block ghost" id="showcfg">Afficher le QR de configuration</button><div class="qr" id="qr2" hidden></div>` : '<p class="muted">Ce GSM n\'est pas encore relié au registre (Réglages).</p>'}</div>`;
  try {
    await loadQr();
    new QRCode($('#qr1'), { text:appBase(), width:220, height:220 });
    if (cfgLink) $('#showcfg').onclick = () => {
      if (s.pin && !unlocked) { toast('Déverrouillez d\'abord les réglages (code responsable)', true); return go('#/settings'); }
      $('#qr2').hidden = false; $('#qr2').innerHTML = ''; new QRCode($('#qr2'), { text:cfgLink, width:260, height:260 }); $('#showcfg').hidden = true;
    };
  } catch(e){ $('#qr1').innerHTML = `<p class="muted">${esc(e.message)}</p>`; }
}

/* ---------- Réglages (code responsable) ---------- */
async function viewSettings(){
  const s = await getSettings();
  if (s.pin && !unlocked){
    V.innerHTML = `<a href="#/plus" class="small muted">← Plus</a><h2>⚙️ Réglages</h2><div class="card"><h3>Code responsable</h3>
      <input class="inp" id="pin" inputmode="numeric" type="password" placeholder="Code" autocomplete="off"><button class="btn block primary" style="margin-top:12px" id="pinok">Déverrouiller</button></div>`;
    const ok = () => { if ($('#pin').value === s.pin) { unlocked = true; render(); } else toast('Code incorrect', true); };
    $('#pinok').onclick = ok; $('#pin').onkeydown = e => { if (e.key === 'Enter') ok(); };
    return;
  }
  const listEdit = (key, items, fmtItem) => `<div class="items" style="margin-bottom:8px">${items.map((it, i) => `<div class="item"><span>${fmtItem(it)}</span><button class="btn small ghost" data-del="${key}:${i}">✕</button></div>`).join('')}</div>`;
  V.innerHTML = `<a href="#/plus" class="small muted">← Plus</a><h2>⚙️ Réglages</h2>
    <div class="card"><h3>Relais (registre, mails)</h3>
      <label class="f">Code de configuration <span class="opt">(reçu par mail : PDJ-CONFIG|…)</span></label><input class="inp" id="cfgcode" placeholder="PDJ-CONFIG|https://script.google.com/…/exec|jeton">
      <button class="btn small ghost" id="cfgapply" style="margin-top:8px">Appliquer le code</button>
      <label class="f">URL du relais</label><input class="inp" id="relay" value="${esc(s.relayUrl)}" placeholder="https://script.google.com/macros/s/…/exec">
      <label class="f">Jeton</label><input class="inp" id="token" value="${esc(s.token)}" autocomplete="off">
      <div class="row" style="margin-top:10px"><button class="btn small primary" id="saverelay">Enregistrer</button><button class="btn small ghost" id="ping">Tester la connexion</button></div></div>
    <div class="card"><h3>Frigos et congélateurs à relever</h3>${listEdit('enc', s.enceintes, e => `${esc(e.n)} <span class="small muted">(${e.t === 'neg' ? 'congélateur' : 'frigo'}${e.max !== undefined && e.max !== null ? ' · limite ≤ ' + fmtT(e.max) + (e.why ? ' — ' + esc(e.why) : '') : ''})</span>`)}
      <div class="row"><input class="inp" id="encn" placeholder="Nom de l'enceinte" style="flex:2 1 160px"><select class="inp" id="enct" style="flex:1 1 120px"><option value="pos">Frigo</option><option value="neg">Congélateur</option></select></div>
      <label class="f">Limite plus stricte que 7 °C <span class="opt">(frigo seulement, facultatif — ex. étiquette « conserver entre 0 et 4 °C »)</span></label>
      <div class="row"><input class="inp" id="encmax" inputmode="decimal" placeholder="ex. 4" style="flex:1 1 90px"><input class="inp" id="encwhy" placeholder="Pourquoi (produits stockés)" style="flex:3 1 180px"></div>
      <button class="btn small ghost" id="encadd" style="margin-top:8px">+ Ajouter</button>
      <p class="small muted">Toute modification d'un seuil doit être validée par le responsable HACCP (elle est tracée sur chaque relevé).</p></div>
    <div class="card"><h3>Buffet chaud à relever</h3>${listEdit('chaud', s.chaud, esc)}<div class="row"><input class="inp" id="chaudn" style="flex:1"><button class="btn small ghost" id="chaudadd">+</button></div></div>
    <div class="card"><h3>Buffet froid à relever</h3>${listEdit('froid', s.froid, esc)}<div class="row"><input class="inp" id="froidn" style="flex:1"><button class="btn small ghost" id="froidadd">+</button></div></div>
    <div class="card"><h3>Heures des relevés du buffet</h3><div class="row">${s.rounds.map((r, i) => `<input class="inp" type="time" data-round="${i}" value="${esc(r)}" style="flex:1 1 90px">`).join('')}</div></div>
    <div class="card"><h3>Thermomètre</h3><label class="f">N° / identification</label><input class="inp" id="thid" value="${esc(s.thermoId)}">
      <label class="f">Dernier contrôle (eau bouillante 100 °C)</label><input class="inp" type="date" id="thcal" value="${esc(s.thermoCalib)}"></div>
    <div class="card"><h3>Code responsable</h3><p class="small muted">Protège ces réglages et le QR de configuration. Laisser vide = pas de code.</p><input class="inp" id="newpin" inputmode="numeric" value="${esc(s.pin)}" placeholder="4 chiffres"></div>
    <button class="btn block primary" id="saveall">Enregistrer les réglages</button>
    <details class="acc" style="margin-top:16px"><summary>Zone de maintenance</summary><div>
      <p class="small">Stockage : ${s.persisted ? 'protégé ✓' : 'non garanti par le navigateur'}.</p>
      <button class="btn small danger" id="abandon" ${S ? '' : 'disabled'}>Abandonner le service en cours</button>
      <p class="small muted">Réservé au responsable (service ouvert par erreur). Le service abandonné n'est pas envoyé.</p></div></details>`;
  $('#cfgapply').onclick = () => {
    const m = $('#cfgcode').value.trim().match(/^PDJ-CONFIG\|(https:\/\/\S+)\|(\S+)$/);
    if (!m) return toast('Code invalide', true);
    $('#relay').value = m[1]; $('#token').value = m[2]; toast('Code appliqué — enregistrez');
  };
  $('#saverelay').onclick = async () => { const n = await getSettings(); n.relayUrl = $('#relay').value.trim(); n.token = $('#token').value.trim(); await saveSettings(n); toast('Enregistré'); flushOutbox(); fetchEtat(); };
  $('#ping').onclick = async () => {
    try { const j = await relay({ kind:'ping' }); toast('Connexion OK — compte ' + (j.account || '')); await fetchEtat(); }
    catch(e){ toast('Échec : ' + e.message, true); }
  };
  $$('[data-del]').forEach(b => b.onclick = async () => {
    const [k, i] = b.dataset.del.split(':'), n = await getSettings();
    const key = { enc:'enceintes', chaud:'chaud', froid:'froid' }[k];
    n[key] = n[key].slice(); n[key].splice(+i, 1); await saveSettings(n); render(true);
  });
  $('#encadd').onclick = async () => {
    const v = $('#encn').value.trim(); if (!v) return;
    const t = $('#enct').value, max = toNum($('#encmax').value), why = $('#encwhy').value.trim();
    if (max !== null && (t !== 'pos' || max >= REF.pos.legal || max < -2)) return toast('Limite spécifique : frigo uniquement, entre −2 et 7 °C', true);
    if (max !== null && !why) return toast('Indiquez pourquoi (produits stockés)', true);
    const n = await getSettings(); n.enceintes = n.enceintes.concat(Object.assign({ n:v, t }, max !== null ? { max, why } : {})); await saveSettings(n); render(true);
  };
  $('#chaudadd').onclick = async () => { const v = $('#chaudn').value.trim(); if (!v) return; const n = await getSettings(); n.chaud = n.chaud.concat(v); await saveSettings(n); render(true); };
  $('#froidadd').onclick = async () => { const v = $('#froidn').value.trim(); if (!v) return; const n = await getSettings(); n.froid = n.froid.concat(v); await saveSettings(n); render(true); };
  $('#saveall').onclick = async () => {
    const n = await getSettings();
    n.rounds = $$('[data-round]').map(i => i.value || DEFAULTS.rounds[+i.dataset.round]);
    n.thermoId = $('#thid').value.trim(); n.thermoCalib = $('#thcal').value; n.pin = $('#newpin').value.trim();
    await saveSettings(n); unlocked = true; toast('Réglages enregistrés');
  };
  $('#abandon').onclick = async () => {
    if (!S || !confirm('Abandonner le service en cours ? Il ne sera pas envoyé.')) return;
    S.closedAt = nowIso(); S.abandoned = true; await saveS(); S = null; toast('Service abandonné'); go('#/');
  };
}

/* ============================================================
   Démarrage
   ============================================================ */
async function applyConfigLink(){
  const m = location.hash.match(/^#cfg=([A-Za-z0-9_-]+)/);
  if (!m) return false;
  try {
    const c = JSON.parse(unb64url(m[1]));
    if (!/^https:\/\/script\.google\.com\//.test(c.u) || !c.t) throw new Error('lien incomplet');
    const s = await getSettings(); s.relayUrl = c.u; s.token = c.t; await saveSettings(s);
    history.replaceState(null, '', location.pathname + '#/');
    toast('GSM relié au registre ✓');
    return true;
  } catch(e){ history.replaceState(null, '', location.pathname + '#/'); toast('Lien de configuration invalide', true); return false; }
}
(async function init(){
  refreshChrome();
  await applyConfigLink();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  try {
    const s = await getSettings();
    if (s.persisted === null && navigator.storage && navigator.storage.persist){ s.persisted = await navigator.storage.persist(); await saveSettings(s); }
  } catch(e){}
  await render();
  flushOutbox();
  fetchEtat().then(rerenderSoft);
  setInterval(() => { if (route.name === 'home' && !$('#sheet').innerHTML && !document.activeElement.matches('input,textarea')) render(true); }, 60000);
})();
</script>
